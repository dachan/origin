<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <% if (webpackConfig.mode === 'production') { %>
    <!-- Production only: the dev server needs eval and hot reload, and Forge
         sets its own development policy. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <% } %>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Origin</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
